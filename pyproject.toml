[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eg2-lessons"
version = "0.1.0"
description = "Beginner-friendly lesson series for Google DeepMind's EmbeddingGemma 2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Keep this in sync with requirements.txt.
dependencies = [
    "torch>=2.2",
    "sentence-transformers>=6.1.0",
    "transformers>=5.18.0",
    "numpy>=1.24",
    "pillow>=9.0",
    "accelerate>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]